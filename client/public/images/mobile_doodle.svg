    <path d="M420 430 l14 14 M434 430 l-14 14"/>
    <path d="M60 420 q10 -14 20 0 q10 14 20 0"/>
  </g>
  <path d="M50 460 q200 40 400 0" stroke="#D9A55C" stroke-width="3" stroke-dasharray="2 12" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- phone body -->
  <rect x="178" y="100" width="144" height="300" rx="26" fill="#F4E7D3" stroke="#452A1B" stroke-width="7"/>
  <rect x="194" y="128" width="112" height="220" rx="6" fill="none" stroke="#452A1B" stroke-width="3.5"/>
  <circle cx="250" cy="118" r="4" fill="#452A1B"/>
  <rect x="234" y="372" width="32" height="6" rx="3" fill="#452A1B"/>

  <!-- app icons doodle grid on screen -->
  <g>
    <rect x="204" y="140" width="34" height="34" rx="9" fill="#7C8A5E"/>
    <rect x="248" y="140" width="34" height="34" rx="9" fill="#B5602F"/>
    <rect x="204" y="184" width="34" height="34" rx="9" fill="#D9A55C"/>
