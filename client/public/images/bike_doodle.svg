<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="500" height="500" fill="#F4E7D3"/>

  <!-- background scatter -->
  <g stroke="#7C8A5E" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M60 60 q10 -14 20 0 q10 14 20 0"/>
    <circle cx="440" cy="80" r="5"/>
    <circle cx="425" cy="95" r="3"/>
    <path d="M50 430 l14 14 M64 430 l-14 14" stroke-width="3"/>
  </g>
  <path d="M40 90 q210 -46 420 6" stroke="#D9A55C" stroke-width="3" stroke-dasharray="2 12" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- big wheel -->
  <g stroke="#452A1B" fill="none" stroke-linecap="round">
    <circle cx="250" cy="260" r="130" stroke-width="7"/>
    <circle cx="250" cy="260" r="34" stroke-width="6" fill="#F4E7D3"/>
    <!-- spokes, slightly irregular -->
    <path d="M250 260 L250 132" stroke-width="3"/>
    <path d="M250 260 L346 176" stroke-width="3"/>
    <path d="M250 260 L378 262" stroke-width="3"/>
    <path d="M250 260 L344 348" stroke-width="3"/>
    <path d="M250 260 L252 388" stroke-width="3"/>
    <path d="M250 260 L156 346" stroke-width="3"/>
    <path d="M250 260 L124 258" stroke-width="3"/>
    <path d="M250 260 L154 174" stroke-width="3"/>
    <circle cx="250" cy="260" r="10" fill="#B5602F" stroke="none"/>
  </g>

  <!-- chain loop bottom right -->
  <g stroke="#452A1B" stroke-width="4" fill="none" stroke-linecap="round">
    <ellipse cx="398" cy="392" rx="16" ry="11" transform="rotate(20 398 392)"/>
    <ellipse cx="420" cy="404" rx="16" ry="11" transform="rotate(20 420 404)"/>
    <ellipse cx="442" cy="416" rx="16" ry="11" transform="rotate(20 442 416)"/>
    <ellipse cx="464" cy="428" rx="16" ry="11" transform="rotate(20 464 428)"/>
  </g>

  <!-- wrench doodle top left -->
  <g transform="translate(90,110) rotate(-30)" stroke="#452A1B" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0 q-14 -14 0 -28 q14 -14 28 0 q10 10 2 20 L18 4 l6 6 l-10 12 z"/>
    <path d="M6 6 L-38 52" stroke-width="6"/>
    <path d="M-38 52 q-10 8 -20 -2 q-10 -10 -2 -20 q6 -6 14 -2 z" fill="#D9A55C" stroke="#452A1B" stroke-width="4"/>
  </g>

  <!-- bolt/nut doodle -->
  <g transform="translate(415,150)" stroke="#452A1B" stroke-width="3.5" fill="#F4E7D3" stroke-linejoin="round">
    <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9"/>
    <circle cx="0" cy="0" r="7" fill="#F4E7D3" stroke="#452A1B" stroke-width="3"/>
  </g>

  <!-- small gear doodle bottom left -->
  <g transform="translate(70,400)" stroke="#452A1B" stroke-width="3" fill="none">
    <circle r="22"/>
    <circle r="8" fill="#B5602F" stroke="none"/>
    <path d="M0 -30 v10 M0 20 v10 M-30 0 h10 M20 0 h10 M-21 -21 l7 7 M14 14 l7 7 M-21 21 l7 -7 M14 -14 l7 -7"/>
  </g>
</svg>
