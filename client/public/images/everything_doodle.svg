<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="500" height="500" fill="#F4E7D3"/>

  <!-- background scatter -->
  <g stroke="#7C8A5E" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55">
    <circle cx="440" cy="70" r="5"/>
    <circle cx="422" cy="55" r="3"/>
    <path d="M50 60 q10 -14 20 0 q10 14 20 0"/>
    <path d="M50 440 l14 14 M64 440 l-14 14"/>
  </g>
  <path d="M40 470 q210 34 420 0" stroke="#D9A55C" stroke-width="3" stroke-dasharray="2 12" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- tote bag -->
  <path d="M120 220 h260 l-14 190 a14 14 0 0 1 -14 12 H148 a14 14 0 0 1 -14 -12 z"
        fill="#F4E7D3" stroke="#452A1B" stroke-width="7" stroke-linejoin="round"/>
  <path d="M164 220 q0 -60 36 -78 q34 -18 68 0 q36 18 36 78"
        fill="none" stroke="#452A1B" stroke-width="6" stroke-linecap="round"/>

  <!-- stitch dashed line along bag -->
  <path d="M132 250 h236" stroke="#D9A55C" stroke-width="3" stroke-dasharray="3 8" opacity="0.8"/>

  <!-- wheel peeking out left -->
  <g stroke="#452A1B" stroke-width="4.5" fill="none">
    <circle cx="90" cy="330" r="56"/>
    <circle cx="90" cy="330" r="14" fill="#F4E7D3"/>
    <path d="M90 330 L90 278 M90 330 L136 306 M90 330 L128 356 M90 330 L52 356 M90 330 L44 306" stroke-width="2.5"/>
  </g>

  <!-- shirt sleeve poking from top of bag -->
  <path d="M212 150 q-18 6 -22 26 l14 10 q10 -14 24 -16 z" fill="#B5602F" stroke="#452A1B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M234 144 q34 -18 66 4 l-10 20 q-24 -14 -46 -2 z" fill="#B5602F" stroke="#452A1B" stroke-width="4" stroke-linejoin="round"/>

  <!-- phone peeking from bag right -->
  <g transform="rotate(14 380 190)">
    <rect x="356" y="140" width="56" height="100" rx="12" fill="#F4E7D3" stroke="#452A1B" stroke-width="5"/>
    <rect x="364" y="152" width="40" height="70" rx="3" fill="#7C8A5E"/>
    <circle cx="384" cy="230" r="3" fill="#452A1B"/>
  </g>

  <!-- ribbon banner with brand -->
  <g>
    <path d="M110 370 h280 l-16 24 16 24 h-280 l16 -24 z" fill="#D9A55C" stroke="#452A1B" stroke-width="4" stroke-linejoin="round"/>
    <text x="250" y="401" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#452A1B" font-weight="bold">VC MART</text>
  </g>

  <!-- stars for flair -->
  <g fill="#B5602F">
    <path d="M420 250 l4 10 11 1 -8 8 2 11 -9 -6 -9 6 2 -11 -8 -8 11 -1 z"/>
    <path d="M70 130 l3 7 8 1 -6 6 1 8 -6 -4 -6 4 1 -8 -6 -6 8 -1 z"/>
  </g>
</svg>
