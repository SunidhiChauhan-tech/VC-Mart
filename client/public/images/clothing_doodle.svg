<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="500" height="500" fill="#F4E7D3"/>

  <!-- scattered background doodles -->
  <g stroke="#B5602F" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M55 70 q10 -14 20 0 q10 14 20 0"/>
    <path d="M420 90 q8 -12 16 0 q8 12 16 0"/>
    <circle cx="70" cy="430" r="5"/>
    <circle cx="90" cy="440" r="3"/>
    <circle cx="430" cy="420" r="4"/>
    <path d="M410 440 l14 14 M424 440 l-14 14" stroke-width="3"/>
    <path d="M40 250 q-4 10 6 14" stroke-width="2.5"/>
  </g>

  <!-- dashed stitch arc top -->
  <path d="M60 60 q190 -50 380 0" stroke="#D9A55C" stroke-width="3" stroke-dasharray="2 12" fill="none" stroke-linecap="round"/>

  <!-- hanger -->
  <g stroke="#452A1B" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="250" cy="95" r="10"/>
    <path d="M250 105 v18"/>
    <path d="M148 178 q102 -70 204 0" />
  </g>

  <!-- shirt body (hand-drawn wobble) -->
  <path d="M148 178
           C 120 200, 96 218, 78 252
           C 70 268, 86 286, 108 278
           L 150 260
           L 150 400
           Q 150 418 168 418
           L 332 418
           Q 350 418 350 400
           L 350 260
           L 392 278
           C 414 286, 430 268, 422 252
           C 404 218, 380 200, 352 178
           C 330 210, 288 226, 250 226
           C 212 226, 170 210, 148 178 Z"
        fill="#F4E7D3" stroke="#452A1B" stroke-width="6" stroke-linejoin="round"/>

  <!-- collar -->
  <path d="M212 182 L250 226 L288 182" fill="none" stroke="#452A1B" stroke-width="5" stroke-linejoin="round"/>

  <!-- pocket with stitch -->
  <rect x="196" y="290" width="58" height="46" rx="6" fill="none" stroke="#452A1B" stroke-width="4"/>
  <path d="M196 302 h58" stroke="#D9A55C" stroke-width="3" stroke-dasharray="3 6"/>

  <!-- buttons -->
  <circle cx="250" cy="250" r="5" fill="#B5602F"/>
  <circle cx="250" cy="300" r="5" fill="#B5602F"/>
  <circle cx="250" cy="350" r="5" fill="#B5602F"/>

  <!-- little heart patch -->
  <path d="M300 300 c-8 -10 -22 -2 -18 10 c3 8 18 18 18 18 s15 -10 18 -18 c4 -12 -10 -20 -18 -10 z"
        fill="#7C8A5E" opacity="0.9"/>

  <!-- thread spool doodle -->
  <g transform="translate(410,330)" stroke="#452A1B" stroke-width="3" fill="none" stroke-linecap="round">
    <rect x="-14" y="-22" width="28" height="44" rx="6" fill="#F4E7D3"/>
    <path d="M-14 -14 h28 M-14 -4 h28 M-14 6 h28 M-14 16 h28" stroke="#D9A55C" stroke-width="4"/>
  </g>

  <!-- scissors doodle -->
  <g transform="translate(60,340) rotate(-20)" stroke="#452A1B" stroke-width="3.5" fill="none" stroke-linecap="round">
    <circle cx="-6" cy="10" r="7"/>
    <circle cx="6" cy="10" r="7"/>
    <path d="M-2 5 L26 -30 M2 5 L-26 -30"/>
  </g>
</svg>
